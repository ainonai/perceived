name: Verify archive and site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - name: Check that published files match their sources
        run: git diff --exit-code -- index.html assets/perceived.css assets/diagrams assets/overviews idea-space-data.json overview-map-record.json build-report.json diagram-redesign-report.json
